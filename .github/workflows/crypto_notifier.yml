name: Crypto Signal Notifier

on:
  schedule:
    # Кожні 30 хвилин, 24/7
    - cron: '*/30 * * * *'
  workflow_dispatch:  # ручний запуск для тесту

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install ccxt requests pandas numpy

      - name: Run notifier
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CRYPTOPANIC_KEY:  ${{ secrets.CRYPTOPANIC_KEY }}
        run: python signal_notifier_v2.py
