name: Periodic check

on:
  schedule:
    # Кожні 30 хвилин, 24/7. Хвилини :07/:37, не :00/:30 — на круглих хвилинах GitHub
    # найсильніше затримує/пропускає scheduled-запуски (фактично було раз на 2-5 год)
    - cron: '7,37 * * * *'
  workflow_dispatch:  # ручний запуск для тесту

# Обидва воркфлоу читають/пишуть той самий кеш crypto_cooldown.json — не запускаємо їх паралельно
# (запуск за розкладом + зовнішній workflow_dispatch інакше можуть дати дубль алерту).
concurrency:
  group: bot-state
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore cooldown state
        uses: actions/cache/restore@v4
        with:
          path: crypto_cooldown.json
          key: cooldown-${{ github.run_id }}
          restore-keys: |
            cooldown-

      - name: Run notifier
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python signal_notifier_v2.py

      - name: Save cooldown state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: crypto_cooldown.json
          key: cooldown-${{ github.run_id }}
