name: Market Digest

on:
  schedule:
    # Щогодини, о 15-й хвилині (щоб не збігатись з іншими крон-джобами о :00/:30)
    - cron: '15 * * * *'
  workflow_dispatch:  # ручний запуск для тесту

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Тільки читаємо — записує й оновлює цей файл реактивний notifier-job.
      # Ключ спільний для обох workflow (репозиторій/гілка), тому підхоплює
      # найсвіжіший стан незалежно від того, який job його зберіг останнім.
      - name: Restore signal tracking state
        uses: actions/cache/restore@v4
        with:
          path: crypto_cooldown.json
          key: cooldown-${{ github.run_id }}
          restore-keys: |
            cooldown-

      - name: Run market digest
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python market_digest.py
