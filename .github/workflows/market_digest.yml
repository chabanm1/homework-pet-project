name: Market Digest

on:
  schedule:
    # Щогодини, о 15-й хвилині (щоб не збігатись з іншими крон-джобами о :00/:30)
    - cron: '15 * * * *'
  workflow_dispatch:  # ручний запуск для тесту

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run market digest
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CRYPTOPANIC_KEY:  ${{ secrets.CRYPTOPANIC_KEY }}
        run: python market_digest.py
